[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-infratec"
version = "0.1.0"
description = "NOMAD plugin: InfraTec infrared camera records (LabVIEW .tdms: ROI temperatures, profiles, fields)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ludek Heller" }]
dependencies = ["nomad-lab>=1.3.0", "numpy", "nptdms>=1.7"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
ir_record = "nomad_infratec.schema_packages:ir_record"
ir_record_parser = "nomad_infratec.parsers:ir_record_parser"
