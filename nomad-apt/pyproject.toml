[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-apt"
version = "0.3.0"
description = "NOMAD plugin: atom probe tomography (CAMECA LEAP) runs - raw files, reconstructions (.pos/.epos/.apt) and range files (.rrng/.rng)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ludek Heller" }]
dependencies = ["nomad-lab>=1.3.0", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
apt = "nomad_apt.schema_packages:apt"
apt_parser = "nomad_apt.parsers:apt_parser"
apt_export_parser = "nomad_apt.parsers:apt_export_parser"
