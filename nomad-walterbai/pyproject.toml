[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-walterbai"
version = "0.1.1"
description = "NOMAD plugin: thermomechanical tests on the Walter+Bai (UTTRMO) machine with 1D DIC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ludek Heller" }]
dependencies = ["nomad-lab>=1.3.0", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
walterbai = "nomad_walterbai.schema_packages:walterbai"
walterbai_parser = "nomad_walterbai.parsers:walterbai_parser"
walterbai_dic_parser = "nomad_walterbai.parsers:walterbai_dic_parser"
