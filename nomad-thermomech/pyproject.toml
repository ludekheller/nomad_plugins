[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-thermomech"
version = "0.4.0"
description = "NOMAD plugin: thermomechanical tests on SMAs from Instron WaveMatrix + Mercury RT DIC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ludek Heller" }]
dependencies = ["nomad-lab>=1.3.0", "numpy", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
thermomech = "nomad_thermomech.schema_packages:thermomech"
wavematrix_parser = "nomad_thermomech.parsers:wavematrix_parser"
mercury_parser = "nomad_thermomech.parsers:mercury_parser"
