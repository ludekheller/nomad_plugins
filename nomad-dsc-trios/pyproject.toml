[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-dsc-trios"
version = "0.6.2"
description = "NOMAD plugin: TA Instruments TRIOS exports - DSC (CSV, JSON) and DMA (JSON) on shape memory alloys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ludek Heller" }]
dependencies = [
    "nomad-lab>=1.3.0",
    "tzdata",            # zoneinfo data for the run-date time zone (slim containers have none)
    "scipy",             # Savitzky-Golay filter and peak search of the tangent-method evaluation
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']
dsc_sma = "nomad_dsc_trios.schema_packages:dsc_sma"
dma_trios = "nomad_dsc_trios.schema_packages:dma_trios"
trios_dsc_parser = "nomad_dsc_trios.parsers:trios_dsc_parser"
trios_dsc_json_parser = "nomad_dsc_trios.parsers:trios_dsc_json_parser"
